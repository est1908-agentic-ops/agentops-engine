name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && 'merge-to-main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Self-hosted runners share $HOME; namespace by runner so concurrent
      # jobs on different runners don't race on the same install path.
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:policies-coverage

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      - run: helm lint charts/engine

      - run: bash charts/engine/tests/run.sh

      - run: helm lint charts/project-worker

      - run: bash charts/project-worker/tests/run.sh

  # Split across two jobs (engine images vs. agent-runner) so both self-hosted
  # runners in the pool build concurrently instead of one runner working
  # through all four images as sequential steps.
  build-engine-images:
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: gitactions.est1908.top
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Public registry (S1). GITHUB_TOKEN + packages:write replaces a
      # long-lived credential; the pushed packages inherit repo visibility, so
      # they are created PRIVATE and must be flipped to public once, per
      # package -- see the S1 design's "package visibility" section.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One buildx invocation for worker/gateway/control (docker-bake.hcl) so
      # BuildKit builds their shared deps/base stages once and builds the
      # three divergent targets concurrently, instead of three separate
      # `docker build` calls serialized as workflow steps.
      #
      # Both registries are pushed from ONE build (dual-push transition, S1).
      # `+=` APPENDS to the target's tag list; a plain second `<target>.tags=`
      # also appends, but `+=` says so. What does NOT work is comma-joining two
      # refs into one assignment -- buildx treats the whole string as a single
      # tag and fails with `invalid tag ...: invalid reference format`.
      - uses: docker/bake-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          set: |
            worker.tags=gitactions.est1908.top/agentic-ops/worker:${{ github.sha }}
            worker.tags+=ghcr.io/est1908-agentic-ops/worker:${{ github.sha }}
            gateway.tags=gitactions.est1908.top/agentic-ops/gateway:${{ github.sha }}
            gateway.tags+=ghcr.io/est1908-agentic-ops/gateway:${{ github.sha }}
            control.tags=gitactions.est1908.top/agentic-ops/control:${{ github.sha }}
            control.tags+=ghcr.io/est1908-agentic-ops/control:${{ github.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      # Package once, push to both registries. The .tgz is byte-identical, so
      # a consumer can move between registries without a chart version change.
      - name: Package and push the engine + project-worker charts (OCI)
        if: github.ref == 'refs/heads/main'
        run: |
          helm registry login gitactions.est1908.top \
            -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_PASSWORD }}"
          helm registry login ghcr.io \
            -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for chart in engine project-worker; do
            helm package "charts/$chart" \
              --version "0.0.0-${{ github.sha }}" \
              --app-version "${{ github.sha }}" \
              --destination /tmp/chart
            helm push "/tmp/chart/$chart-0.0.0-${{ github.sha }}.tgz" \
              oci://gitactions.est1908.top/agentic-ops
            helm push "/tmp/chart/$chart-0.0.0-${{ github.sha }}.tgz" \
              oci://ghcr.io/est1908-agentic-ops
          done

  build-agent-runner-image:
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: gitactions.est1908.top
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Public registry (S1) -- see the note in build-engine-images.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: images/agent-runner
          file: images/agent-runner/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            gitactions.est1908.top/agentic-ops/agent-runner:${{ github.sha }}
            gitactions.est1908.top/agentic-ops/agent-runner:latest
            ghcr.io/est1908-agentic-ops/agent-runner:${{ github.sha }}
            ghcr.io/est1908-agentic-ops/agent-runner:latest

# The `bump-platform` job (and scripts/bump-platform-engine-tags.sh) was removed
# in S1. It committed engine image pins to est1908-agentic-ops/agentops-platform
# on every merge -- but that repo is the distributable TEMPLATE; the live cluster
# moved to agentops-platform-homelab. So it wrote deploy pins for a cluster that
# does not exist, into a repo about to be published as "fork me". ArgoCD Image
# Updater is the mechanism for image tags now.
#
# It does NOT cover the chart targetRevision, and neither did the deleted script:
# any change touching charts/engine/** or charts/project-worker/** still needs a
# manual targetRevision bump to the merge sha in each consuming repo, or that
# cluster runs new image code against an old chart.
