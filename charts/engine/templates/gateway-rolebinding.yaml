apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-gateway-secrets
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-gateway-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-gateway
    namespace: {{ .Values.namespace }}
